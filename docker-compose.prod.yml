services:
  caddy:
    image: caddy:2-alpine
    container_name: smartbus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ${ECR_REGISTRY:-smartbus}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbus-app
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartbus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartbus_db}
      - ALLOWED_ORIGINS=https://pranshusharma.tech,https://www.pranshusharma.tech
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-smartbus-backups-pranshusharma}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: smartbus-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-smartbus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-smartbus_db}
    volumes:
      - /var/lib/smartbus/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbus} -d ${POSTGRES_DB:-smartbus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    image: ${ECR_REGISTRY:-smartbus}:${IMAGE_TAG:-latest}
    container_name: smartbus-simulator
    restart: unless-stopped
    command: ["python", "simulator.py", "--hour", "9", "--api", "http://app:8000"]
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    container_name: smartbus-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-smartbus}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-smartbus_db}
      - S3_BUCKET=${S3_BACKUP_BUCKET:-smartbus-backups-pranshusharma}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
    entrypoint: |
      sh -c '
      apk add --no-cache aws-cli
      while true; do
        sleep 86400
        DATE=$$(date +%Y%m%d_%H%M%S)
        pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /tmp/backup_$$DATE.sql.gz
        aws s3 cp /tmp/backup_$$DATE.sql.gz s3://$$S3_BUCKET/db/backup_$$DATE.sql.gz --sse AES256
        rm -f /tmp/backup_$$DATE.sql.gz
      done'
    depends_on:
      - db

volumes:
  caddy_data:
  caddy_config:
