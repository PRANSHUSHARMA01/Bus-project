services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  simulator:
    build: .
    command: python simulator.py --api http://api:8000 --hour 9
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [api]

volumes:
  caddy_data: {}
