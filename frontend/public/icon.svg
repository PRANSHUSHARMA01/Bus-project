<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A6E3F"/>
      <stop offset="100%" stop-color="#054C2B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A900"/>
      <stop offset="100%" stop-color="#E08B00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#busGrad)"/>

  <!-- Subtle Inner Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Bus Chassis Container -->
  <g filter="url(#shadow)">
    <!-- Bus Body Base -->
    <rect x="96" y="104" width="320" height="280" rx="44" fill="#ffffff"/>

    <!-- Front Windshield -->
    <path d="M 124 136 L 388 136 A 20 20 0 0 1 404 156 L 404 220 A 12 12 0 0 1 392 232 L 120 232 A 12 12 0 0 1 108 220 L 108 156 A 20 20 0 0 1 124 136 Z" fill="#0F172A"/>

    <!-- Windshield Divider -->
    <line x1="256" y1="136" x2="256" y2="232" stroke="#334155" stroke-width="4"/>

    <!-- Destination Sign Board (DTC Route LED) -->
    <rect x="156" y="146" width="200" height="28" rx="6" fill="#000000"/>
    <text x="256" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#F4A900" text-anchor="middle" letter-spacing="3">DELHI SMART BUS</text>

    <!-- Side Passenger Windows -->
    <rect x="116" y="248" width="60" height="48" rx="8" fill="#1E293B"/>
    <rect x="188" y="248" width="60" height="48" rx="8" fill="#1E293B"/>
    <rect x="264" y="248" width="60" height="48" rx="8" fill="#1E293B"/>
    <rect x="336" y="248" width="60" height="48" rx="8" fill="#1E293B"/>

    <!-- Dual Headlights -->
    <circle cx="140" cy="336" r="18" fill="#FACC15"/>
    <circle cx="140" cy="336" r="10" fill="#FFFFFF"/>
    <circle cx="372" cy="336" r="18" fill="#FACC15"/>
    <circle cx="372" cy="336" r="10" fill="#FFFFFF"/>

    <!-- Front Grille & License Plate -->
    <rect x="206" y="326" width="100" height="20" rx="4" fill="#E2E8F0"/>
    <rect x="216" y="330" width="80" height="12" rx="2" fill="#F8FAFC"/>
    <text x="256" y="340" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">DL 1P C1409</text>

    <!-- Front Bumper -->
    <rect x="100" y="364" width="312" height="20" rx="8" fill="#0F172A"/>

    <!-- Tyres / Wheels -->
    <rect x="116" y="380" width="56" height="32" rx="10" fill="#090D16"/>
    <rect x="340" y="380" width="56" height="32" rx="10" fill="#090D16"/>
  </g>

  <!-- Live Pulse Beacon Ring -->
  <circle cx="256" cy="74" r="12" fill="#22C55E"/>
  <circle cx="256" cy="74" r="18" fill="none" stroke="#22C55E" stroke-width="3" stroke-opacity="0.6"/>
</svg>
