version: '3.8'

services:
  smart-bus:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-bus:latest
    container_name: smart-bus-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET:-smart_bus_production_jwt_secret_change_in_env}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pranshusharma.tech,http://localhost:8000}
    volumes:
      - ./backend/data:/app/backend/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
