services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbus-app
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://smartbus:smartbus_pass@db:5432/smartbus_db
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000
      - DEV_MODE=true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: smartbus-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=smartbus
      - POSTGRES_PASSWORD=smartbus_pass
      - POSTGRES_DB=smartbus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbus -d smartbus_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: smartbus-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbus-simulator
    restart: unless-stopped
    command: ["python", "simulator.py", "--hour", "9", "--api", "http://app:8000"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
